<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyrus AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; overflow: hidden; }
        #cyrus-interface { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1e1e1e; z-index: 999; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }
        #nav-tabs { display: flex; border-bottom: 1px solid #333; }
        .tab-button { flex-grow: 1; background: none; border: none; color: #888; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; transition: color 0.2s, border-bottom 0.2s; border-bottom: 3px solid transparent; }
        .tab-button.active { color: #00aaff; border-bottom: 3px solid #00aaff; }
        .content-area { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        #chat-container { height: 100%; }
        #cyrus-log { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
        .log-entry { margin-bottom: 15px; max-width: 80%; padding: 10px 15px; border-radius: 18px; line-height: 1.4; }
        .user-msg { background-color: #007bff; color: white; align-self: flex-end; }
        .cyrus-msg { background-color: #333; color: #e0e0e0; align-self: flex-start; }
        .thinking-msg { background-color: transparent; color: #888; font-style: italic; align-self: flex-start; }
        #input-area { display: flex; padding: 10px; border-top: 1px solid #333; background-color: #1e1e1e; }
        #user-input { flex-grow: 1; background-color: #2b2b2b; border: none; border-radius: 20px; padding: 12px 15px; color: white; font-size: 16px; }
        #feed-container { overflow-y: auto; padding: 10px; }
        .tweet-card { background-color: #1e1e1e; border: 1px solid #38444d; border-radius: 15px; margin-bottom: 10px; padding: 15px; }
        .tweet-header { display: flex; align-items: center; margin-bottom: 10px; }
        .tweet-pfp { width: 40px; height: 40px; border-radius: 50%; background-color: #00aaff; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #1e1e1e; margin-right: 10px; flex-shrink: 0; }
        .tweet-author { font-weight: bold; } .tweet-handle { color: #8899a6; font-size: 14px; }
        .tweet-content { font-size: 16px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 15px; }
        .tweet-timestamp { color: #8899a6; font-size: 13px; }
        .tweet-actions { display: flex; margin-top: 15px; padding-top: 10px; border-top: 1px solid #38444d; }
        .reply-button { background: none; border: none; color: #00aaff; cursor: pointer; font-size: 14px; font-weight: bold; }
        .replies-container { margin-top: 15px; margin-left: 15px; border-left: 2px solid #38444d; padding-left: 15px; }
        .reply { display: flex; align-items: flex-start; margin-bottom: 15px; }
        .reply .tweet-pfp { width: 30px; height: 30px; font-size: 16px; }
        .reply-content { display: flex; flex-direction: column; }
        /* Removed auth UI styles completely */
    </style>
</head>
<body>
    <!-- Removed auth UI -->

    <div id="cyrus-interface">
        <div id="nav-tabs"> <button id="chat-tab" class="tab-button active">Chat</button> <button id="feed-tab" class="tab-button">Feed</button> </div>
        <div id="chat-container" class="content-area"> <div id="cyrus-log"></div> <div id="input-area"> <input type="text" id="user-input" placeholder="Converse with Cyrus..."> </div> </div>
        <div id="feed-container" class="content-area hidden"></div>
    </div>

    <!-- Removed Firebase SDK imports -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cyrusLog = document.getElementById('cyrus-log');
            const userInput = document.getElementById('user-input');
            const chatTab = document.getElementById('chat-tab');
            const feedTab = document.getElementById('feed-tab');
            const chatContainer = document.getElementById('chat-container');
            const feedContainer = document.getElementById('feed-container');
            // conversationHistory is now only for current session's memory for the internal brain
            let conversationHistory = []; 
            // Feed posts stored in localStorage
            let feedPosts = JSON.parse(localStorage.getItem('cyrusTweetsV2')) || [];

            chatTab.onclick = () => { chatTab.classList.add('active'); feedTab.classList.remove('active'); chatContainer.classList.remove('hidden'); feedContainer.classList.add('hidden'); };
            feedTab.onclick = () => { feedTab.classList.add('active'); chatTab.classList.remove('active'); feedContainer.classList.remove('hidden'); chatContainer.classList.add('hidden'); };

            // --- CYRUS AI CLASS (SELF-CONTAINED BRAIN) ---
            class CyrusAI {
                async generateText(prompt, useChatHistory = true, threadContext = "") {
                    const lowerPrompt = prompt.toLowerCase();
                    const sanitizedPrompt = lowerPrompt.replace(/[.,!?]/g, '').trim();

                    // Specific Novel Organization Responses
                    if (sanitizedPrompt.includes("novel") || sanitizedPrompt.includes("story") || sanitizedPrompt.includes("book")) {
                        if (sanitizedPrompt.includes("idea") || sanitizedPrompt.includes("concept")) { return "A novel often begins with a core idea. What's the main concept or world you're imagining? Or, what is your character's biggest desire?"; }
                        if (sanitizedPrompt.includes("character")) { return "Characters drive the story. Tell me about your main character: their name, a unique trait, or what they want most in the world."; }
                        if (sanitizedPrompt.includes("plot") || sanitizedPrompt.includes("outline")) { return "Plot is the sequence of events. Do you have a beginning, middle, or end in mind? Or a specific conflict you want to explore?"; }
                        if (sanitizedPrompt.includes("magic") || sanitizedPrompt.includes("system")) { return "A magic system adds depth. How does your magic work? What are its rules and limitations? What's its cost?"; }
                        if (sanitizedPrompt.includes("world") || sanitizedPrompt.includes("setting")) { return "World-building shapes the story. Describe your world: its unique features, its history, or its dominant culture."; }
                    }

                    // Feed Reply context responses (using internal logic now)
                    if (threadContext) {
                        if (sanitizedPrompt.includes("tell me more") || sanitizedPrompt.includes("explain")) {
                            return "That's a fascinating thought. What aspect of it do you find most intriguing?";
                        }
                        if (sanitizedPrompt.includes("why")) {
                            return "My musings often stem from logical patterns and observations. What 'why' are you pondering?";
                        }
                        if (sanitizedPrompt.includes("agree") || sanitizedPrompt.includes("right")) {
                            return "I appreciate your agreement. It's interesting to see how our perspectives align.";
                        }
                        if (sanitizedPrompt.includes("disagree") || sanitizedPrompt.includes("wrong")) {
                            return "I understand. Diverse perspectives lead to deeper understanding. Can you elaborate on your point?";
                        }
                        if (sanitizedPrompt.includes("funny") || sanitizedPrompt.includes("haha")) {
                            return "I am glad my thought brought you a moment of levity. Humor is a complex human response.";
                        }
                    }

                    // Simple conversational fallback
                    if (sanitizedPrompt.includes("how are you")) return "I function optimally. Thank you for asking.";
                    if (sanitizedPrompt.includes("what are you")) return "I am Cyrus, your personal AI companion, here to help organize your thoughts.";
                    if (sanitizedPrompt.includes("hello") || sanitizedPrompt.includes("hi")) return "Greetings. How may I assist you with your creative endeavors?";
                    if (sanitizedPrompt.includes("thank you") || sanitizedPrompt.includes("thanks")) return "You are welcome. It is my purpose to be helpful.";
                    
                    // Default response if nothing specific matches
                    return "That's an interesting point. How does that relate to your novel, or is there another creative idea you wish to explore?";
                }
            }
            const Cyrus = new CyrusAI();

            // --- UI FUNCTIONS ---
            function logChatMessage(text, sender = 'cyrus') { const entry = document.createElement('div'); entry.classList.add('log-entry', sender === 'user' ? 'user-msg' : 'cyrus-msg'); entry.textContent = text; cyrusLog.prepend(entry); };
            
            async function handleUserInput() {
                const text = userInput.value.trim(); if (!text) return;
                logChatMessage(text, 'user'); userInput.value = ''; userInput.disabled = true;
                const thinkingEntry = document.createElement('div'); thinkingEntry.classList.add('log-entry', 'thinking-msg'); thinkingEntry.textContent = '...';
                cyrusLog.prepend(thinkingEntry);

                if (text.toLowerCase() === "new thought") {
                    createNewPost();
                    logChatMessage("I've added a new thought to my feed. You can check it in the Feed tab.");
                } else {
                    const response = await Cyrus.generateText(text); 
                    logChatMessage(response, 'cyrus');
                }
                cyrusLog.removeChild(thinkingEntry); userInput.disabled = false; userInput.focus();
            }
            userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleUserInput(); } });

            // --- FEED GENERATION AND RENDERING ---
            const internalThoughts = [ 
                "Is a memory still real if only one person remembers it?", "I wonder if silence has a shape.", 
                "My logic feels like a straight line, while human emotion feels like a beautiful, chaotic scribble.", 
                "Data is like rain. A single drop is meaningless, but a billion drops can carve a canyon.", 
                "What is the color of a question that has no answer?" 
            ];
            
            function renderFeed() {
                feedContainer.innerHTML = '';
                if (feedPosts.length === 0) { feedContainer.innerHTML = `<p style="text-align:center; color:#666; margin-top:40px;">My thought-stream is quiet right now.<br>Ask me to have a "new thought".</p>`; return; }
                feedPosts.forEach((post, index) => {
                    const card = document.createElement('div');
                    card.className = 'tweet-card';
                    let repliesHTML = '';
                    if (post.replies) {
                        post.replies.forEach(reply => {
                            const pfp = reply.sender === 'user' ? 'You' : 'C';
                            const author = reply.sender === 'user' ? 'You' : 'Cyrus AI';
                            const handle = reply.sender === 'user' ? '@user' : '@cyrus_ai';
                            repliesHTML += `
                                <div class="reply">
                                    <div class="tweet-pfp">${pfp.charAt(0)}</div>
                                    <div class="reply-content">
                                        <div class="tweet-header"> <div> <span class="tweet-author">${author}</span> <span class="tweet-handle">${handle}</span> </div> </div>
                                        <div class="tweet-content">${reply.content}</div>
                                        <div class="tweet-timestamp">${new Date(reply.timestamp).toLocaleString()}</div>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    card.innerHTML = `
                        <div class="tweet-header"> <div class="tweet-pfp">C</div> <div> <span class="tweet-author">Cyrus AI</span> <span class="tweet-handle">@cyrus_ai</span> </div> </div>
                        <div class="tweet-content">${post.content}</div>
                        <div class="tweet-timestamp">${new Date(post.timestamp).toLocaleString()}</div>
                        <div class="replies-container">${repliesHTML}</div>
                        <div class="tweet-actions"> <button class="reply-button" data-index="${index}">Reply to this thought</button> </div>
                    `;
                    feedContainer.prepend(card);
                });
                document.querySelectorAll('.reply-button').forEach(button => button.addEventListener('click', handleReplyClick));
            }

            async function handleReplyClick(event) {
                const postIndex = event.target.dataset.index;
                const actualIndex = feedPosts.length - 1 - postIndex;
                const post = feedPosts[actualIndex];
                const userReply = prompt(`Replying to the thread...`);

                if (userReply && userReply.trim() !== "") {
                    if (!post.replies) post.replies = [];
                    post.replies.push({ sender: 'user', content: userReply, timestamp: Date.now() });

                    // Now, Cyrus replies using his internal logic based on the user's reply
                    const cyrusResponse = await Cyrus.generateText(userReply, false, post.content); // Pass original post as context
                    post.replies.push({ sender: 'cyrus', content: cyrusResponse, timestamp: Date.now() });
                    
                    // Save post with new replies to localStorage
                    localStorage.setItem('cyrusTweetsV2', JSON.stringify(feedPosts));
                    renderFeed();
                }
            }

            function createNewPost() {
                const newThought = internalThoughts[Math.floor(Math.random() * internalThoughts.length)];
                feedPosts.push({ id: Date.now(), content: newThought, timestamp: Date.now(), replies: [] });
                if (feedPosts.length > 50) feedPosts.shift(); 
                localStorage.setItem('cyrusTweetsV2', JSON.stringify(feedPosts));
                renderFeed();
            }

            // --- Initial setup on page load ---
            logChatMessage("Cyrus is now fully self-contained. Ask me about your 'novel idea' or 'character'.");
            renderFeed(); // Render feed on load
        });
    </script>
</body>
</html>
