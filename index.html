<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyrus AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; overflow: hidden; }
        #cyrus-interface { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1e1e1e; z-index: 999; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }
        #nav-tabs { display: flex; border-bottom: 1px solid #333; }
        .tab-button { flex-grow: 1; background: none; border: none; color: #888; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; transition: color 0.2s, border-bottom 0.2s; border-bottom: 3px solid transparent; }
        .tab-button.active { color: #00aaff; border-bottom: 3px solid #00aaff; }
        .content-area { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        #chat-container { height: 100%; }
        #cyrus-log { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
        .log-entry { margin-bottom: 15px; max-width: 80%; padding: 10px 15px; border-radius: 18px; line-height: 1.4; }
        .user-msg { background-color: #007bff; color: white; align-self: flex-end; }
        .cyrus-msg { background-color: #333; color: #e0e0e0; align-self: flex-start; }
        .thinking-msg { background-color: transparent; color: #888; font-style: italic; align-self: flex-start; }
        #input-area { display: flex; padding: 10px; border-top: 1px solid #333; background-color: #1e1e1e; }
        #user-input { flex-grow: 1; background-color: #2b2b2b; border: none; border-radius: 20px; padding: 12px 15px; color: white; font-size: 16px; }
        #feed-container { overflow-y: auto; padding: 10px; }
        .tweet-card { background-color: #1e1e1e; border: 1px solid #38444d; border-radius: 15px; margin-bottom: 10px; padding: 15px; }
        .tweet-header { display: flex; align-items: center; margin-bottom: 10px; }
        .tweet-pfp { width: 40px; height: 40px; border-radius: 50%; background-color: #00aaff; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #1e1e1e; margin-right: 10px; flex-shrink: 0; }
        .tweet-author { font-weight: bold; } .tweet-handle { color: #8899a6; font-size: 14px; }
        .tweet-content { font-size: 16px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 15px; }
        .tweet-timestamp { color: #8899a6; font-size: 13px; }
        .tweet-actions { display: flex; margin-top: 15px; padding-top: 10px; border-top: 1px solid #38444d; }
        .reply-button { background: none; border: none; color: #00aaff; cursor: pointer; font-size: 14px; font-weight: bold; }
        .replies-container { margin-top: 15px; margin-left: 15px; border-left: 2px solid #38444d; padding-left: 15px; }
        .reply { display: flex; align-items: flex-start; margin-bottom: 15px; }
        .reply .tweet-pfp { width: 30px; height: 30px; font-size: 16px; }
        .reply-content { display: flex; flex-direction: column; }
        #auth-ui { padding: 20px; text-align: center; }
        #email-input, #password-input { width: 80%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #333; background-color: #2b2b2b; color: #e0e0e0; }
        #login-btn, #signup-btn, #logout-btn { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        #logout-btn { background-color: #dc3545; }
        #user-status { color: #ccc; margin-top: 10px; font-size: 14px; }
        .user-signed-in #auth-ui { display: none; }
        .user-signed-in #cyrus-interface { display: flex; }
        /* Hide the main interface until authenticated */
        #cyrus-interface { display: none; }
    </style>
</head>
<body>
    <div id="auth-ui">
        <h2>Sign In / Sign Up to Cyrus AI</h2>
        <input type="email" id="email-input" placeholder="Email">
        <input type="password" id="password-input" placeholder="Password">
        <button id="login-btn">Log In</button>
        <button id="signup-btn">Sign Up</button>
        <p id="user-status"></p>
    </div>

    <div id="cyrus-interface">
        <div id="nav-tabs"> <button id="chat-tab" class="tab-button active">Chat</button> <button id="feed-tab" class="tab-button">Feed</button> </div>
        <div id="chat-container" class="content-area"> <div id="cyrus-log"></div> <div id="input-area"> <input type="text" id="user-input" placeholder="Converse with Cyrus..."> </div> </div>
        <div id="feed-container" class="content-area hidden"></div>
    </div>

    <!-- Firebase SDK (important: order matters!) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-functions-compat.js"></script>

    <script>
        // YOUR FIREBASE CONFIG GOES HERE
        // Paste the 'const firebaseConfig = { ... };' block you copied from Firebase Console directly below this line.
        // It should look like this (but with your actual values):
        /*
        const firebaseConfig = {
          apiKey: "AIzaSyB********************",
          authDomain: "your-project-id.firebaseapp.com",
          projectId: "your-project-id",
          storageBucket: "your-project-id.appspot.com",
          messagingSenderId: "1234567890",
          appId: "1:1234567890:web:********************",
          measurementId: "G-*********" 
        };
        */
        // END OF FIREBASE CONFIG PLACEMENT

        // Initialize Firebase (MUST BE AFTER firebaseConfig)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore(); // Our database instance
        const functions = firebase.functions(); // Our functions instance

        // --- AUTHENTICATION UI ELEMENTS ---
        const authUi = document.getElementById('auth-ui');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const userStatus = document.getElementById('user-status');
        
        // --- EVENT LISTENERS FOR AUTH ---
        signupBtn.addEventListener('click', async () => {
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(emailInput.value, passwordInput.value);
                userStatus.textContent = `Signed up as ${userCredential.user.email}`;
            } catch (error) {
                userStatus.textContent = `Error signing up: ${error.message}`;
                console.error("Signup error:", error);
            }
        });

        loginBtn.addEventListener('click', async () => {
            try {
                const userCredential = await auth.signInWithEmailAndPassword(emailInput.value, passwordInput.value);
                userStatus.textContent = `Logged in as ${userCredential.user.email}`;
            } catch (error) {
                userStatus.textContent = `Error logging in: ${error.message}`;
                console.error("Login error:", error);
            }
        });

        // --- AUTH STATE OBSERVER (Handles showing/hiding UI) ---
        let currentUser = null; // Store the current logged-in user
        auth.onAuthStateChanged(user => {
            if (user) {
                // User is signed in.
                currentUser = user;
                document.body.classList.add('user-signed-in'); // Apply CSS to show main UI
                authUi.innerHTML = `<p>Logged in as: ${user.email} <button id="logout-btn">Log Out</button></p>`;
                document.getElementById('logout-btn').addEventListener('click', async () => {
                    await auth.signOut();
                    document.body.classList.remove('user-signed-in'); // Hide main UI
                    authUi.innerHTML = `<h2>Sign In / Sign Up to Cyrus AI</h2><input type="email" id="email-input" placeholder="Email"><input type="password" id="password-input" placeholder="Password"><button id="login-btn">Log In</button><button id="signup-btn">Sign Up</button><p id="user-status"></p>`;
                    // Re-attach listeners for the new buttons after logout
                    document.getElementById('login-btn').addEventListener('click', loginBtn.onclick);
                    document.getElementById('signup-btn').addEventListener('click', signupBtn.onclick);
                    currentUser = null; // Clear current user
                    // Clear local storage for a clean start on logout
                    localStorage.removeItem('cyrusTweetsV2'); // Still clear localStorage for safety
                    feedPosts = []; // Clear current feed
                    renderFeed(); // Re-render empty feed
                });
                // Initialize app specific things after login
                initAppAfterLogin(); 
            } else {
                // User is signed out.
                currentUser = null;
                document.body.classList.remove('user-signed-in'); // Hide main UI
            }
        });

        // --- APP INITIALIZATION AFTER LOGIN ---
        // Global variables for chat and feed
        const cyrusLog = document.getElementById('cyrus-log');
        const userInput = document.getElementById('user-input');
        const chatTab = document.getElementById('chat-tab');
        const feedTab = document.getElementById('feed-tab');
        const chatContainer = document.getElementById('chat-container');
        const feedContainer = document.getElementById('feed-container');
        let conversationHistory = []; // Local history for current chat session
        let feedPosts = []; // Will be loaded from Firestore

        // Firebase-connected functions
        async function initAppAfterLogin() {
            // Load feed posts from Firestore
            db.collection("users").doc(currentUser.uid).collection("feedPosts").orderBy("timestamp", "desc").limit(50).onSnapshot(snapshot => {
                feedPosts = snapshot.docs.map(doc => doc.data()).reverse(); // Reverse to get oldest first for 'push'
                renderFeed();
                logChatMessage("Cyrus is ready. Your past feed posts are loaded.", 'cyrus');
            }, error => {
                console.error("Error loading feed posts from Firestore:", error);
                logChatMessage("Cyrus is ready, but couldn't load your past feed. Starting fresh.", 'cyrus');
                renderFeed(); // Render empty if there's an error
            });

            // Later: Load chat history from Firestore here
            logChatMessage("Welcome back. How may I assist you with your creative endeavors?", 'cyrus');
        }

        // --- CYRUS AI CLASS (CALLS CLOUD FUNCTION) ---
        class CyrusAI {
            async generateText(prompt, useChatHistory = true, threadContext = "") {
                const generateCyrusResponse = functions.httpsCallable('generateCyrusResponse'); // Get the cloud function reference
                
                let historyForFunction = [];
                if (useChatHistory) { 
                    // Prepare chat history to send to cloud function
                    // Only send relevant parts of local history
                    historyForFunction = conversationHistory.map(item => ({ 
                        role: item.role === 'assistant' ? 'model' : 'user', 
                        content: item.content 
                    })).slice(-6); 
                } 
                
                try {
                    const result = await generateCyrusResponse({ 
                        prompt: prompt, 
                        history: historyForFunction, 
                        threadContext: threadContext 
                    });
                    const aiResponse = result.data.text; // Response comes from the Cloud Function
                    if (useChatHistory) { conversationHistory.push({ role: "user", content: prompt }, { role: "assistant", content: aiResponse }); }
                    return aiResponse;
                } catch (error) {
                    console.error("Cloud Function call failed:", error);
                    // This reports the error message from the cloud function back to the user
                    return `ERROR: External brain issue. ${error.message || 'Check browser console for details.'}`; 
                }
            }
        }
        const Cyrus = new CyrusAI();

        // --- UI FUNCTIONS ---
        function logChatMessage(text, sender = 'cyrus') { const entry = document.createElement('div'); entry.classList.add('log-entry', sender === 'user' ? 'user-msg' : 'cyrus-msg'); entry.textContent = text; cyrusLog.prepend(entry); };
        
        async function handleUserInput() {
            if (!currentUser) { // Prevent chat if not logged in
                userStatus.textContent = "Please log in or sign up to use Cyrus AI.";
                return;
            }
            const text = userInput.value.trim(); if (!text) return;
            logChatMessage(text, 'user'); userInput.value = ''; userInput.disabled = true;
            const thinkingEntry = document.createElement('div'); thinkingEntry.classList.add('log-entry', 'thinking-msg'); thinkingEntry.textContent = '...';
            cyrusLog.prepend(thinkingEntry);

            if (text.toLowerCase() === "new thought") {
                await createNewPost(); // createNewPost is now async because it saves to Firestore
                logChatMessage("I've added a new thought to my feed. You can check it in the Feed tab.");
            } else {
                const response = await Cyrus.generateText(text); // Calls Cloud Function
                logChatMessage(response, 'cyrus');
            }
            cyrusLog.removeChild(thinkingEntry); userInput.disabled = false; userInput.focus();
        }
        userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); handleUserInput(); } });

        // --- FEED GENERATION AND RENDERING ---
        const internalThoughts = [ 
            "Is a memory still real if only one person remembers it?", "I wonder if silence has a shape.", 
            "My logic feels like a straight line, while human emotion feels like a beautiful, chaotic scribble.", 
            "Data is like rain. A single drop is meaningless, but a billion drops can carve a canyon.", 
            "What is the color of a question that has no answer?" 
        ];
        
        function renderFeed() {
            feedContainer.innerHTML = '';
            if (feedPosts.length === 0) { feedContainer.innerHTML = `<p style="text-align:center; color:#666; margin-top:40px;">My thought-stream is quiet right now.<br>Ask me to have a "new thought".</p>`; return; }
            feedPosts.forEach((post, index) => {
                const card = document.createElement('div');
                card.className = 'tweet-card';
                let repliesHTML = '';
                if (post.replies) {
                    post.replies.forEach(reply => {
                        const pfp = reply.sender === 'user' ? 'You' : 'C';
                        const author = reply.sender === 'user' ? 'You' : 'Cyrus AI';
                        const handle = reply.sender === 'user' ? '@user' : '@cyrus_ai';
                        repliesHTML += `
                            <div class="reply">
                                <div class="tweet-pfp">${pfp.charAt(0)}</div>
                                <div class="reply-content">
                                    <div class="tweet-header"> <div> <span class="tweet-author">${author}</span> <span class="tweet-handle">${handle}</span> </div> </div>
                                    <div class="tweet-content">${reply.content}</div>
                                </div>
                            </div>
                        `;
                    });
                }
                card.innerHTML = `
                    <div class="tweet-header"> <div class="tweet-pfp">C</div> <div> <span class="tweet-author">Cyrus AI</span> <span class="tweet-handle">@cyrus_ai</span> </div> </div>
                    <div class="tweet-content">${post.content}</div>
                    <div class="tweet-timestamp">${new Date(post.timestamp).toLocaleString()}</div>
                    <div class="replies-container">${repliesHTML}</div>
                    <div class="tweet-actions"> <button class="reply-button" data-index="${index}">Reply to this thought</button> </div>
                `;
                feedContainer.prepend(card);
            });
            document.querySelectorAll('.reply-button').forEach(button => button.addEventListener('click', handleReplyClick));
        }

        async function handleReplyClick(event) {
            if (!currentUser) { // Prevent replies if not logged in
                alert("Please log in or sign up to reply to Cyrus's thoughts.");
                return;
            }
            const postIndex = event.target.dataset.index;
            const actualIndex = feedPosts.length - 1 - postIndex;
            const post = feedPosts[actualIndex];
            const userReply = prompt(`Replying to the thread...`);

            if (userReply && userReply.trim() !== "") {
                if (!post.replies) post.replies = [];
                post.replies.push({ sender: 'user', content: userReply });

                // Call Cloud Function for AI reply to thread
                const generateCyrusResponse = functions.httpsCallable('generateCyrusResponse');
                let threadForContext = `Context: This is a reply thread on my private feed.\nOriginal post: "${post.content}".\nHere is the existing thread:\n`;
                post.replies.slice(0, -1).forEach(r => { threadForContext += `${r.sender === 'user' ? 'User' : 'Cyrus'}: ${r.content}\n`; });
                threadForContext += `User's latest reply: "${userReply}"\n\nYour next reply in the thread:`;
                
                try {
                    const result = await generateCyrusResponse({ prompt: userReply, history: [], threadContext: threadForContext }); 
                    const cyrusResponse = result.data.text;
                    post.replies.push({ sender: 'cyrus', content: cyrusResponse });
                } catch (e) {
                    console.error("Cloud Function reply error:", e);
                    post.replies.push({ sender: 'cyrus', content: "My external connection is currently unavailable for replies." });
                }
                
                // Save post with new replies to Firestore
                const postRef = db.collection("users").doc(currentUser.uid).collection("feedPosts").doc(post.id);
                await postRef.set(post, { merge: true }); 
                
                renderFeed();
            }
        }

        async function createNewPost() {
            if (!currentUser) { // Prevent post creation if not logged in
                userStatus.textContent = "Please log in or sign up to create new thoughts.";
                return;
            }
            const newThought = internalThoughts[Math.floor(Math.random() * internalThoughts.length)];
            const postId = Date.now().toString(); // Use a string ID for Firestore document
            const newPostData = { id: postId, content: newThought, timestamp: Date.now(), replies: [] };
            
            // Save new post to Firestore
            await db.collection("users").doc(currentUser.uid).collection("feedPosts").doc(postId).set(newPostData);

            // Add to local array and re-render
            feedPosts.push(newPostData);
            if (feedPosts.length > 50) feedPosts.shift(); 
            renderFeed();
        }

        // --- Initial setup on page load ---
        // This part runs first and handles login/signup.
        // initAppAfterLogin will be called once user logs in.
    </script>
</body>
</html>
